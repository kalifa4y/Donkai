    <!-- Données structurées Schema.org (WebApplication & FAQPage) -->
    <script type="application/ld+json">
      [
        {
          "@context": "https://schema.org",
          "@type": "WebApplication",
          "name": "DONKAI",
          "url": "https://donkai.app",
          "description": "Plateforme de collecte communautaire et de soutien participatif par Mobile Money en Afrique de l'Ouest.",
          "applicationCategory": "FinanceApplication",
          "operatingSystem": "All",
          "creator": {
            "@type": "Organization",
            "name": "Oshun Web Studio",
            "url": "https://oshunwebstudio.netlify.app"
          }
        },
        {
          "@context": "https://schema.org",
          "@type": "FAQPage",
          "mainEntity": [
            {
              "@type": "Question",
              "name": "Comment créer une collecte sur DONKAI ?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Moins de 2 minutes suffisent pour lancer votre collecte. Cliquez sur 'Créer une collecte', renseignez votre objectif financier en FCFA, désignez le bénéficiaire des fonds et recevez immédiatement votre lien public dédié."
              }
            },
            {
              "@type": "Question",
              "name": "Les donateurs doivent-ils créer un compte ?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Non. Aucun compte n'est requis pour les donateurs. Vos contributeurs accèdent directement au lien de votre collecte depuis WhatsApp ou les réseaux sociaux, choisissent leur montant et valident en 10 secondes via Orange Money, Wave ou Moov Money."
              }
            },
            {
              "@type": "Question",
              "name": "Quels sont les frais appliqués sur DONKAI ?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "La création de collecte est 100% gratuite. 0 FCFA de frais pour les donateurs (100% de leur geste est reversé). Une contribution solidaire de fonctionnement de 5% est automatiquement déduite sur les fonds reçus lors du versement au porteur de projet. Les retraits vers votre numéro Mobile Money sont sans aucun frais additionnel."
              }
            },
            {
              "@type": "Question",
              "name": "Comment et quand puis-je retirer l'argent collecté ?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Vous pouvez demander un versement à tout moment dès 5 000 FCFA disponibles. Le transfert est envoyé directement vers votre numéro Mobile Money (Orange, Wave, Moov) après validation rapide par notre équipe de sécurité."
              }
            },
            {
              "@type": "Question",
              "name": "Quels moyens de paiement sont supportés ?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Orange Money, Wave et Moov Money sont acceptés nativement au Mali, Sénégal, Côte d'Ivoire, Bénin, Togo et Guinée."
              }
            },
            {
              "@type": "Question",
              "name": "Comment DONKAI protège-t-il les fonds contre la fraude ?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Un verrouillage anti-fraude de 30 jours sur toute mise à jour de numéro de retrait, une vérification d'identité (KYC) obligatoire au palier de 500 000 FCFA, et une modération active des signalements sous 24h."
              }
            }
          ]
        }
      ]
    </script>

    <!-- Détection et synchronisation automatique immédiate du thème système (Dark / Light) -->
    <script>
      (function() {
        if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>
